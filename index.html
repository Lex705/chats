<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PulseChat</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="welcomeScreen" class="welcome-screen hidden">
      <div class="welcome-card">
        <div class="brand-wrap">
          <div class="brand-mark">P</div>
          <div>
            <h1>PulseChat</h1>
          </div>
        </div>

        <div class="welcome-copy">
          <h2>Welcome! Let's get you connected.</h2>
        </div>

        <div class="welcome-avatar-wrap">
          <label for="welcomeAvatarInput" class="welcome-avatar-label">
            <img id="welcomeAvatarPreview" alt="Profile preview" class="welcome-avatar-preview" src="" />
            <span class="welcome-avatar-overlay">Add photo</span>
          </label>
          <input id="welcomeAvatarInput" type="file" accept="image/*" class="hidden" />
        </div>

        <form id="welcomeForm" class="welcome-form">
          <label>
            <span>Choose your display name</span>
            <input id="welcomeNameInput" type="text" maxlength="25" placeholder="Your display name" />
          </label>
          <p id="welcomeError" class="welcome-error hidden">Please enter a valid name.</p>
          <button type="submit" class="primary-btn">Continue to Chat</button>
        </form>
      </div>
    </div>

    <div id="authScreen" class="auth-screen">
      <div class="auth-card">
        <div class="brand-wrap">
          <div class="brand-mark">P</div>
          <div>
            <h1>PulseChat</h1>
            <p>Live messaging for teams and friends</p>
          </div>
        </div>

        <div class="auth-toggle">
          <button type="button" class="auth-tab active" data-auth-mode="login">Login</button>
          <button type="button" class="auth-tab" data-auth-mode="register">Register</button>
        </div>

        <form id="loginForm" class="auth-form active">
          <label>
            <span>Email</span>
            <input type="email" id="loginEmail" placeholder="you@gmail.com" required />
          </label>
          <label>
            <span>Password</span>
            <input type="password" id="loginPassword" placeholder="Password" required />
          </label>
          <button type="submit" class="primary-btn">Login</button>
          <button type="button" class="link-btn small" id="demoLoginBtn">Use demo account</button>
        </form>

        <form id="registerForm" class="auth-form">
          <label>
            <span>Name</span>
            <input type="text" id="registerName" placeholder="Your name" required />
          </label>
          <label>
            <span>Email</span>
            <input type="email" id="registerEmail" placeholder="you@gmail.com" required />
          </label>
          <label>
            <span>Phone number</span>
            <input type="tel" id="registerPhone" placeholder="+234 800 000 0000" />
          </label>
          <label>
            <span>Password</span>
            <input type="password" id="registerPassword" placeholder="Choose a password" required />
          </label>
          <button type="submit" class="primary-btn">Create account</button>
        </form>
      </div>
    </div>

    <div id="appShell" class="app-shell hidden">
      <aside class="sidebar">
        <div class="profile-panel">
          <div class="avatar" id="profileAvatar">U</div>
          <div class="profile-meta">
            <div class="profile-line">
              <h2 id="profileName">Your Name</h2>
              <button id="editProfileBtn" type="button" class="small-btn">Edit</button>
            </div>
            <p id="profileStatus">Available now</p>
          </div>
        </div>

        <div class="toolbar">
          <input id="contactSearch" type="search" placeholder="Search chats or contacts" />
          <button id="newChatBtn" type="button" class="small-btn">New chat</button>
        </div>

        <div class="section-head">
          <h3>Chats</h3>
          <span id="chatCount">0</span>
        </div>

        <div id="chatList" class="chat-list"></div>

        <div class="section-head muted-row">
          <h3>Archived</h3>
          <button type="button" id="archiveBtn" class="link-btn small">View</button>
        </div>

        <div class="section-head muted-row">
          <h3>Settings</h3>
          <button type="button" id="settingsBtn" class="link-btn small">Open</button>
        </div>
      </aside>

      <main class="chat-panel">
        <header class="chat-header">
          <div class="chat-user-wrap">
            <button type="button" id="mobileBackBtn" class="mobile-back-btn hidden">←</button>
            <div class="avatar header-avatar" id="headerAvatar">A</div>
            <div>
              <p id="chatPresence" class="presence-pill">online</p>
              <h1 id="chatTitle">Select a chat</h1>
            </div>
          </div>

          <div class="header-actions">
            <button id="themeToggleBtn" type="button" class="ghost-btn">Dark mode</button>
            <button id="logoutBtn" type="button" class="ghost-btn">Log out</button>
          </div>
        </header>

        <div id="typingIndicator" class="typing-indicator hidden"></div>
        <div id="messages" class="messages" aria-live="polite"></div>
        <div id="replyBox" class="reply-box hidden"></div>

        <form id="messageForm" class="composer">
          <div class="composer-tools">
            <button type="button" id="emojiBtn" class="icon-btn" aria-label="Emoji">☺</button>
            <button type="button" id="attachBtn" class="icon-btn" aria-label="Attach file">📎</button>
            <button type="button" id="voiceBtn" class="icon-btn" aria-label="Voice message">🎙️</button>
            <input type="file" id="fileInput" class="hidden" multiple />
          </div>

          <textarea id="messageInput" rows="2" placeholder="Type a message..." required></textarea>

          <div class="composer-actions">
            <button type="button" id="clearReplyBtn" class="ghost-btn">Clear reply</button>
            <button type="submit" class="primary-btn">Send</button>
          </div>
        </form>
      </main>

      <aside class="info-panel">
        <div class="info-card">
          <h3>Profile</h3>
          <div class="info-profile">
            <div class="avatar large" id="infoAvatar">U</div>
            <div>
              <strong id="infoName">Your Name</strong>
              <small id="infoEmail">you@gmail.com</small>
            </div>
          </div>
        </div>

        <div class="info-card">
          <h3>Online users</h3>
          <div id="onlineList" class="online-list"></div>
        </div>

        <div class="info-card">
          <h3>Find people</h3>

          <label class="finder-field">
            <span>Search by Gmail or email address</span>
            <div class="finder-row">
              <input id="gmailSearchInput" type="email" placeholder="name@gmail.com" />
              <button type="button" id="gmailSearchBtn" class="small-btn">Search</button>
            </div>
          </label>
          <div id="gmailSearchResult" class="finder-result"></div>

          <label class="finder-field">
            <span>Search by Phone Number</span>
            <div class="finder-row">
              <input id="phoneSearchInput" type="tel" placeholder="+234 812 345 6789" />
              <button type="button" id="phoneSearchBtn" class="small-btn">Search</button>
            </div>
          </label>
          <div id="phoneSearchResult" class="finder-result"></div>
        </div>

        <div class="info-card">
          <h3>Status</h3>
          <div class="status-row">
            <button type="button" id="setStatusBtn">Update status</button>
          </div>
          <p id="statusPreview" class="status-preview">Available now</p>
        </div>
      </aside>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
  </body>
</html>
